# ============================================================
# mock-upstream 最小 nginx 配置（T09-D / T10-D 落地）
# 用途：E2E 剧本 U5（docs/sql/t09-docker-e2e.sh）—— 网关转发用例的
#       上游 mock 服务；避免外联 httpbin.org 等需要拉新镜像的依赖。
# 挂载方式：docker-compose.yml 中 bind-mount 到容器
#           /etc/nginx/conf.d/default.conf:ro
# 约束：复用 nginx:1.25-alpine 镜像（frontend 已用，零新增下载）；
#       容器内 80 端口；不暴露 host 端口（仅 compose 内网可达）。
# 验证：upstreamUrl 在 E2E 中填 http://mock-upstream:80
# ============================================================

server {
    listen 80 default_server;
    server_name _;

    # 最小 mock：所有请求一律返回 200 + 固定 JSON。
    # 实际 E2E 验证只看 HTTP 200 + 落库 total≥1，body 文本不影响断言。
    location / {
        default_type application/json;
        return 200 '{"mock":"true","service":"gatekeeper-e2e-mock-upstream"}';
    }

    # 健康探活：E2E U1 通过此端点判定容器可用
    location = /healthz {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }
}
