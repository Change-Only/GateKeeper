# 前端 Nginx 站点配置：静态资源 + /api 反向代理
server {
    listen 80;
    server_name _;

    # SPA 静态资源
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # 前端路由 history 模式：刷新非根路径时回退到 index.html
        try_files $uri $uri/ /index.html;
    }

    # 接口反向代理：与开发环境 devServer.proxy 行为一致（保留 /api 前缀转发）
    #
    # ── 集群适配说明（重要）──────────────────────────────────────────────
    # 本镜像为 nginx 1.25，尚不支持 `upstream { server backend:8080 resolve; }`
    # （该指令需要 1.27.3+）。因此改用等效的「变量 + resolver」写法来获得运行时解析：
    #
    #   1) resolver 127.0.0.11 = Docker 内嵌 DNS（仅存在于用户自定义网络，本 compose 即是）。
    #      valid=10s ⇒ 最多 10 秒重新解析一次服务名 `backend`，
    #      backend 扩容/缩容后新副本能在 10 秒内自动进入负载，**无需改配置、无需重启 nginx**。
    #   2) proxy_pass 必须写成【变量】。若写成字面量 `proxy_pass http://backend:8080;`，
    #      nginx 只在【启动那一刻】解析一次并固定下来 —— 集群扩容后新副本永远收不到流量，
    #      而正在扩缩容时会打到已下线的 IP。
    #   3) Docker DNS 对同一服务名会返回**全部副本 IP**，nginx 对多地址按轮询使用。
    #
    # ⚠️ 副作用：proxy_pass 一旦使用变量，nginx 不再自动拼接原始 URI，
    #    必须显式带上 $request_uri，否则 /api 前缀会丢失
    #    （后端 context-path=/api，丢了必然 404）。
    # ────────────────────────────────────────────────────────────────────
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $gk_backend "http://backend:8080";
        proxy_pass $gk_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # 静态资源缓存：带 hash 的资源可长期缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Gzip 压缩：显著减小 JS/CSS 传输体积
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
}
