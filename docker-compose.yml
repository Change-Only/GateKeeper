# ============================================================
# GateKeeper 一键部署编排（MySQL + Redis + 后端网关 + 前端 Nginx）
# 使用方式：
#   1. 复制 .env.example 为 .env 并填写真实密钥（三项必填）
#   2. docker compose up -d
#   3. 访问 http://localhost:8081
# ============================================================

services:
  # ---------- MySQL 数据库 ----------
  mysql:
    image: mysql:8.0
    container_name: gatekeeper-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${GATEKEEPER_DB_PASSWORD:?请在 .env 中配置 GATEKEEPER_DB_PASSWORD}
      MYSQL_DATABASE: ${GATEKEEPER_DB_NAME:-gatekeeper}
      TZ: Asia/Shanghai
    # 首次启动自动执行建表脚本（11 文件有序链，按字典序挂载；源文件名不动）
    #   ⚠ 关于 #11（t09-hygiene.sql）：方案 §3.2 原文 YAML 已含本条目但标注
    #   「可选，待 lead 确认终稿」——T10-D 施工将其定位【升级为必需】。
    #   原因：`docs/sql/t03a-seed-permissions.sql:33` 会播种重复菜单行
    #   `sys_menu.id=221`（与 `migrate-v2.sql` 播的 `id=212` 同 pid=5/type=2/
    #   route='/sys/bizline'/name='业务线管理'，且 221 零 sys_role_menu 引用、
    #   零子节点）。若不挂 hygiene，fresh bootstrap 后 `sys_menu` 总数 = 113
    #   ≠ dev 库现状 112，T09-B 修复的"双业务线管理"问题会在容器栈重现。
    #   t09-hygiene.sql 实际行为（非 no-op）：
    #     · DELETE sys_menu.id=221 —— 首跑删 1 行；WHERE 共 7 个条件：
    #       5 列精确锁定（id+pid+type+route_path+name）+ 两处 NOT EXISTS 防误删
    #       （已授权/有子节点即不删）；重跑命中 0 行；
    #     · ALTER alert.alarm_level / app.audit_status —— 仅改 COMMENT，
    #       列 definition 守恒（与 dev 库实测一致）；
    #     · UPDATE sys_dict SET remark WHERE dict_code='alarm_level' —— 1 行。
    #   完整判据与 T11 候选见 docs/T10-D-初始化链幂等性核对与T11候选.md。
    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/backend/src/main/resources/sql/init.sql:/docker-entrypoint-initdb.d/00-t01-base.sql:ro
      - ./docs/sql/schema-v2.sql:/docker-entrypoint-initdb.d/01-schema-v2.sql:ro
      - ./docs/sql/migrate-v2.sql:/docker-entrypoint-initdb.d/02-migrate-v2.sql:ro
      - ./docs/sql/t02-seed-admin-role.sql:/docker-entrypoint-initdb.d/03-t02-seed.sql:ro
      - ./docs/sql/t03a-seed-permissions.sql:/docker-entrypoint-initdb.d/04-t03a-seed.sql:ro
      - ./docs/sql/t03b-seed-permissions.sql:/docker-entrypoint-initdb.d/05-t03b-seed.sql:ro
      - ./docs/sql/seed-perm-alignment.sql:/docker-entrypoint-initdb.d/06-t05-seed.sql:ro
      - ./docs/sql/seed-datascope-perm.sql:/docker-entrypoint-initdb.d/07-t05-datascope.sql:ro
      - ./docs/sql/t07a-seed-rules.sql:/docker-entrypoint-initdb.d/08-t07a-seed.sql:ro
      - ./docs/sql/t08-seed-perms.sql:/docker-entrypoint-initdb.d/09-t08-seed.sql:ro
      - ./docs/sql/t09-hygiene.sql:/docker-entrypoint-initdb.d/10-t09-hygiene.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      # 用容器内运行时环境变量取密码（$$ 转义），避免密码被内联进容器配置、docker inspect 可见
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- Redis（限流/封禁/Nonce 防重放） ----------
  redis:
    image: redis:7-alpine
    container_name: gatekeeper-redis
    restart: unless-stopped
    environment:
      # 通过运行时环境变量把口令传给 redis-server；不写进 command 字面量，
      # 避免口令出现在 docker inspect 的 Cmd 里
      GATEKEEPER_REDIS_PASSWORD: "${GATEKEEPER_REDIS_PASSWORD:-GkRedis#9fQ2mL7pX!4sT8nB}"
    # 必须设置 requirepass：否则容器外可无密码直接读写限流/封禁/权限缓存
    # （本项目安全策略要求「默认密码须可配置且可替换」，默认值见 README「默认账号与密钥」）
    command: ["sh", "-c", "exec redis-server --requirepass \"$$GATEKEEPER_REDIS_PASSWORD\""]
    volumes:
      - redis-data:/data
    healthcheck:
      # 带鉴权探活：REDISCLI_AUTH 让 redis-cli 免于在命令行暴露口令
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$GATEKEEPER_REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- 后端网关服务 ----------
  backend:
    build: ./src/backend
    container_name: gatekeeper-backend
    restart: unless-stopped
    environment:
      # 数据源：指向 compose 内的 mysql 容器
      GATEKEEPER_DB_HOST: mysql
      GATEKEEPER_DB_PORT: 3306
      GATEKEEPER_DB_NAME: ${GATEKEEPER_DB_NAME:-gatekeeper}
      GATEKEEPER_DB_USERNAME: ${GATEKEEPER_DB_USERNAME:-root}
      GATEKEEPER_DB_PASSWORD: ${GATEKEEPER_DB_PASSWORD:?请在 .env 中配置 GATEKEEPER_DB_PASSWORD}
      # Redis：指向 compose 内的 redis 容器（口令须与 redis 服务的 requirepass 一致）
      GATEKEEPER_REDIS_HOST: redis
      GATEKEEPER_REDIS_PASSWORD: "${GATEKEEPER_REDIS_PASSWORD:-GkRedis#9fQ2mL7pX!4sT8nB}"
      # 安全密钥（启动自检强校验，缺失或弱密钥将拒绝启动）
      GATEKEEPER_JWT_SECRET: ${GATEKEEPER_JWT_SECRET:?请在 .env 中配置至少32位的 GATEKEEPER_JWT_SECRET}
      GATEKEEPER_AES_KEY: ${GATEKEEPER_AES_KEY:?请在 .env 中配置至少32位的 GATEKEEPER_AES_KEY}
      # 跨域来源：生产环境改成实际访问域名
      GATEKEEPER_CORS_ORIGINS: ${GATEKEEPER_CORS_ORIGINS:-http://localhost:8081}
      # 导出文件目录：挂载持久卷，容器重建后历史导出文件不丢
      GATEKEEPER_EXPORT_DIR: /app/data/exports
    volumes:
      - export-data:/app/data/exports
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------- 前端 Nginx ----------
  frontend:
    build: ./src/frontend
    container_name: gatekeeper-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend

  # ---------- mock 上游（E2E U5 网关转发用例，方案 §3.3；复用 frontend 已用的 nginx 镜像，零新增下载） ----------
  mock-upstream:
    image: nginx:1.25-alpine
    container_name: gatekeeper-mock-upstream
    restart: unless-stopped
    volumes:
      - ./docker/mock-upstream.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mysql-data:
  redis-data:
  export-data:
